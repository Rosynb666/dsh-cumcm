<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">数模台 · CUMCM 论文工作台</title>
  <desc id="desc">把国赛论文做成一条看得见的生产线：P0–P7 进度、facts 事实台账、一键编译 PDF。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.56" stop-color="#0a1b2d"/>
      <stop offset="1" stop-color="#0d2537"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1020 86) rotate(118) scale(410 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1fe0c2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#1fe0c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(720 330) rotate(-40) scale(380 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4c8bf5" stop-opacity=".16"/>
      <stop offset="1" stop-color="#4c8bf5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54f4d4"/>
      <stop offset="1" stop-color="#59a8ff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2ee6c5" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#59a8ff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#59a8ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b7d8f4" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="340" rx="28" fill="url(#glow2)"/>

  <path d="M0 294C130 258 214 321 338 294C476 264 532 203 662 225C789 247 842 319 967 288C1072 262 1128 238 1200 249" fill="none" stroke="url(#line)" stroke-width="1.4"/>
  <path d="M0 306C160 274 230 330 378 302C504 278 568 231 682 250C813 272 880 334 1004 306C1100 284 1157 266 1200 272" fill="none" stroke="#59a8ff" stroke-opacity=".08" stroke-width="1"/>

  <rect x="48" y="86" width="5" height="78" rx="2.5" fill="url(#accent)"/>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
    <text x="73" y="78" fill="#66e7d0" font-size="12.5" font-weight="600" letter-spacing="3.1">DEEPSEEK HARNESS · CUMCM WORKBENCH</text>

    <text x="70" y="170" fill="#f7fbff" font-size="82" font-weight="800" letter-spacing="2">数模台</text>
    <circle cx="334" cy="158" r="5" fill="#54f4d4"/>

    <text x="73" y="216" fill="#c9d9ea" font-size="26" font-weight="500" letter-spacing=".5">把国赛论文，做成一条看得见的生产线</text>
    <text x="73" y="248" fill="#8098b0" font-size="14.5" letter-spacing=".35">从赛题到可编译论文，进度、数字与合规都落在同一张台面上。</text>

    <g transform="translate(73 272)">
      <rect width="132" height="32" rx="16" fill="#102b3d" stroke="#2ee6c5" stroke-opacity=".3"/>
      <circle cx="17" cy="16" r="3.2" fill="#54f4d4"/>
      <text x="29" y="21" fill="#b9eade" font-size="12.5">P0–P7 全流程</text>

      <g transform="translate(144 0)">
        <rect width="132" height="32" rx="16" fill="#102b3d" stroke="#59a8ff" stroke-opacity=".28"/>
        <circle cx="17" cy="16" r="3.2" fill="#59a8ff"/>
        <text x="29" y="21" fill="#bdd8f4" font-size="12.5">facts 事实台账</text>
      </g>

      <g transform="translate(288 0)">
        <rect width="140" height="32" rx="16" fill="#102b3d" stroke="#f0b86e" stroke-opacity=".28"/>
        <circle cx="17" cy="16" r="3.2" fill="#f0b86e"/>
        <text x="29" y="21" fill="#f0d5ad" font-size="12.5">一键编译 PDF</text>
      </g>
    </g>

    <text x="73" y="327" fill="#5d748b" font-size="11.5" letter-spacing=".4">MIT · Rosynb666</text>
    <text x="1128" y="327" fill="#5d748b" font-size="11.5" text-anchor="end" letter-spacing=".4">skill 2.1  /  plugin 0.1.0</text>
  </g>

