    <circle r="112" fill="none" stroke="#b7d8f4" stroke-opacity=".12"/>
    <circle r="82" fill="none" stroke="#54f4d4" stroke-opacity=".13" stroke-dasharray="3 9"/>
    <path d="M0 -112A112 112 0 0 1 112 0" fill="none" stroke="#54f4d4" stroke-opacity=".58" stroke-width="2" stroke-linecap="round"/>

    <g fill="#0c2234" stroke="#54f4d4" stroke-opacity=".65">
      <circle cx="0" cy="-112" r="6"/>
      <circle cx="79" cy="-79" r="4.5"/>
      <circle cx="112" cy="0" r="4.5"/>
      <circle cx="79" cy="79" r="4.5"/>
      <circle cx="0" cy="112" r="4.5"/>
      <circle cx="-79" cy="79" r="4.5"/>
      <circle cx="-112" cy="0" r="4.5"/>
      <circle cx="-79" cy="-79" r="4.5"/>
    </g>
    <circle cx="0" cy="-112" r="2.5" fill="#54f4d4"/>
    <circle cx="112" cy="0" r="2.5" fill="#59a8ff"/>
    <circle cx="0" cy="112" r="2.5" fill="#f0b86e"/>

    <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#6fe7d2">
      <text x="0" y="-130" text-anchor="middle">P0</text>
      <text x="92" y="-96" text-anchor="start" fill="#84bfff">P1</text>
      <text x="128" y="4" text-anchor="start" fill="#84bfff">P2</text>
      <text x="92" y="100" text-anchor="start" fill="#84bfff">P3</text>
      <text x="0" y="132" text-anchor="middle" fill="#f0c489">P4</text>
      <text x="-92" y="100" text-anchor="end" fill="#f0c489">P5</text>
      <text x="-128" y="4" text-anchor="end">P6</text>
      <text x="-92" y="-96" text-anchor="end" fill="#5d8ab4">P7</text>
    </g>

    <rect x="-43" y="-55" width="90" height="112" rx="9" fill="#03101b" opacity=".55" transform="translate(4 5)"/>
    <rect x="-44" y="-56" width="90" height="112" rx="9" fill="#f4f9ff"/>
    <path d="M25 -56H46V-35Z" fill="#caddec"/>
    <rect x="-29" y="-37" width="35" height="4" rx="2" fill="#b8cadb"/>
    <rect x="-29" y="-27" width="25" height="4" rx="2" fill="#d4e1ec"/>

    <path d="M-28 18L-14 4L-3 12L12 -9L30 0" fill="none" stroke="#11b99b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-28 31H30" stroke="#dce6ef" stroke-width="1.2"/>
    <circle cx="12" cy="-9" r="3" fill="#59a8ff"/>

    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
      <text x="0" y="82" text-anchor="middle" fill="#d7e6f3" font-size="13" font-weight="600" letter-spacing="1.2">P0–P7</text>
      <text x="0" y="99" text-anchor="middle" fill="#66809a" font-size="10.5" letter-spacing="1.6">WORKFLOW</text>
